<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Рабочий стол</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <!-- Desktop -->
  <section id="view-home" class="view">
    <header class="top">
      <h1>Рабочий стол</h1>
    </header>
    <div id="desktop" class="grid"></div>
  </section>

  <!-- Market catalog -->
  <section id="view-market" class="view hidden">
    <header class="top bar">
      <button type="button" class="icon-btn" id="market-back" aria-label="Назад">←</button>
      <h1>Маркет</h1>
    </header>
    <p class="muted">Каталог мини-приложений. Нажмите иконку — откроется веб-версия.</p>
    <div id="catalog" class="grid"></div>
  </section>

  <!-- In-app browser for web versions -->
  <section id="view-browser" class="view browser hidden">
    <header class="top bar">
      <button type="button" class="icon-btn" id="browser-back" aria-label="Назад">←</button>
      <h1 id="browser-title" class="title-ellip">…</h1>
      <button type="button" class="action-btn" id="browser-action">Установить</button>
    </header>
    <iframe id="browser-frame" title="web" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
  </section>

  <p id="err" class="err"></p>
  <script src="./script.js"></script>
</body>
</html>
