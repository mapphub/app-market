name: Release package
on:
  push:
    branches: [main]
    paths-ignore:
      - 'mapp/public/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version
        id: ver
        run: |
          VER=$(jq -r '.version // empty' mapp/mapp.manifest.json)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Skip if version already released
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          CUR=$(gh release view latest --json body,name,tagName -q '.body + " " + .name + " " + .tagName' 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "push" ] && echo "$CUR" | grep -qF "$VER"; then
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SvelteKit → mapp/public
        run: |
          npm ci || npm install
          npm run build
          test -f mapp/public/index.html

      - name: Commit built mapp/public to main
        run: |
          git config user.name mapphub-bot
          git config user.email bot@mapphub.local
          git add -A mapp/public mapp/mapp.manifest.json
          if git diff --cached --quiet; then
            echo "already up to date"
          else
            git commit -m "build: SvelteKit output → mapp/public"
            git push origin HEAD:main
          fi

      - name: Package ZIP + release in app-market repo only
        if: steps.skip.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd mapp && zip -r -q ../app.zip .)
          gh release delete latest -y 2>/dev/null || true
          gh release create latest app.zip \
            --title "market ${{ steps.ver.outputs.version }}" \
            --notes "version ${{ steps.ver.outputs.version }}" \
            --latest

      - name: Update catalog.json only
        if: steps.skip.outputs.skip_release != 'true'
        env:
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TOKEN="${ORG_ADMIN_TOKEN:-}"
          if [ -z "$TOKEN" ]; then echo "ORG_ADMIN_TOKEN missing"; exit 0; fi
          PKG="https://github.com/mapphub/app-market/releases/latest/download/app.zip"
          MU="https://raw.githubusercontent.com/mapphub/app-market/main/mapp/mapp.manifest.json"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          rm -rf /tmp/site && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/mapphub/mapphub.github.io.git" /tmp/site
          jq --arg ver "$VER" --arg pkg "$PKG" --arg mu "$MU" --arg now "$NOW" \
            '(.apps//[])|=map(if .id=="market" then .version=$ver|.packageUrl=$pkg|.releaseUrl=$pkg|.manifestUrl=$mu else . end)|.updatedAt=$now' \
            /tmp/site/catalog.json > /tmp/c.json && mv /tmp/c.json /tmp/site/catalog.json
          cd /tmp/site && git config user.name mapphub-ci && git config user.email ci@mapphub.local
          git add catalog.json && (git diff --cached --quiet || git commit -m "catalog: market@$VER") && git push || true

      - name: Deploy gh-pages
        run: |
          rm -rf /tmp/gh && mkdir -p /tmp/gh
          cp -a mapp/public/. /tmp/gh/
          cd /tmp/gh
          git init && git checkout -b gh-pages
          git config user.name mapphub-bot
          git config user.email bot@mapphub.local
          git add -A && git commit -m "pages: mirror mapp/public"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
