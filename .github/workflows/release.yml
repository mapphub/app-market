name: Release package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npm run build
      - run: |
          test -f mapp/public/index.html
          (cd mapp && zip -r -q ../app.zip .)
          ls -lh app.zip
      - name: Single latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y 2>/dev/null || true
          gh release create latest app.zip --title "home-screen latest" --notes "SvelteKit static" --latest
      - name: gh-pages from mapp/public
        run: |
          set -euo pipefail
          rm -rf /tmp/gh && mkdir -p /tmp/gh
          cp -a mapp/public/. /tmp/gh/
          cd /tmp/gh
          git init && git checkout -b gh-pages
          git config user.name mapphub-bot
          git config user.email bot@mapphub.local
          git add -A && git commit -m "pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
