name: Release package
on:
  push:
    branches: [main]
    paths-ignore:
      - 'mapp/public/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          VER=$(jq -r '.version // empty' mapp/mapp.manifest.json)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Skip if version already released
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          CUR=$(gh release view latest --json body,name,tagName -q '.body + " " + .name + " " + .tagName' 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "push" ] && echo "$CUR" | grep -qF "$VER"; then
            echo "Version $VER already released — skip package/release (still allow build commit if sources changed)"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SvelteKit → mapp/public
        run: |
          set -euo pipefail
          npm ci || npm install
          npm run build
          test -f mapp/public/index.html
          ls -la mapp/public | head -40

      - name: Commit built mapp/public to main
        run: |
          set -euo pipefail
          git config user.name mapphub-bot
          git config user.email bot@mapphub.local
          git add -A mapp/public mapp/mapp.manifest.json
          if git diff --cached --quiet; then
            echo "mapp/public already up to date"
          else
            git commit -m "build: SvelteKit output → mapp/public"
            git push origin HEAD:main
          fi

      - name: Package ZIP + single latest release
        if: steps.skip.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd mapp && zip -r -q ../app.zip .)
          ls -lh app.zip
          gh release delete latest -y 2>/dev/null || true
          gh release create latest app.zip \
            --title "market ${{ steps.ver.outputs.version }}" \
            --notes "version ${{ steps.ver.outputs.version }}" \
            --latest

      - name: Push market.zip to portal
        if: steps.skip.outputs.skip_release != 'true'
        env:
          PUBLIC_SITE_TOKEN: ${{ secrets.PUBLIC_SITE_TOKEN }}
          PKG_VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_SITE_TOKEN:-}" ]; then
            echo "PUBLIC_SITE_TOKEN not set — skip portal push"
            exit 0
          fi
          test -f app.zip || (cd mapp && zip -r -q ../app.zip .)
          CONTENT=$(base64 -w0 app.zip)
          API="https://api.github.com/repos/mapphub/mapphub.github.io/contents/packages/market.zip"
          HDR=(-H "Authorization: Bearer $PUBLIC_SITE_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          SHA=$(curl -fsSL "${HDR[@]}" "$API" 2>/dev/null | jq -r '.sha // empty' || true)
          BODY=$(jq -n --arg msg "package market@$PKG_VER" --arg content "$CONTENT" --arg sha "$SHA" \
            '{message:$msg, content:$content} + (if $sha != "" then {sha:$sha} else {} end)')
          curl -fsSL -X PUT "${HDR[@]}" -H "Content-Type: application/json" -d "$BODY" "$API" >/dev/null
          echo "portal packages/market.zip updated"

      - name: Deploy identical tree to gh-pages
        run: |
          set -euo pipefail
          rm -rf /tmp/gh && mkdir -p /tmp/gh
          cp -a mapp/public/. /tmp/gh/
          cd /tmp/gh
          git init
          git checkout -b gh-pages
          git config user.name mapphub-bot
          git config user.email bot@mapphub.local
          git add -A
          git commit -m "pages: mirror mapp/public (SvelteKit)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Enable GitHub Pages (gh-pages /)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            gh api -X PUT "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/ || true
          else
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/ || true
          fi
          gh api "repos/${{ github.repository }}/pages" --jq '{html_url,status,source}' || true
