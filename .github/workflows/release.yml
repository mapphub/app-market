name: Release package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zip
      - run: |
          test -d mapp
          (cd mapp && zip -r -q ../app.zip .)
          # legacy name for older shells
          if [ -f mapp/mapp.manifest.json ]; then
            cp mapp/mapp.manifest.json mappmanifest.json
            zip -q app.zip mappmanifest.json || true
          fi
          ls -lh app.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: launcher v0.4.${{ github.run_number }}
          files: app.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
